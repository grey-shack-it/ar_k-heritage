<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ar-k-heritage | 대한민국 국가유산 3D AR 뷰어</title>
  <!-- Google model-viewer CDN -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #111; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    /* 상단 컨트롤 및 유물 정보 패널 */
    #panel {
      position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10;
      background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(12px);
      padding: 16px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    .select-label { font-size: 11px; color: #aaa; margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
    #heritage-select {
      width: 100%; padding: 12px; background: #222; color: #fff;
      border: 1px solid #444; border-radius: 8px; font-size: 15px; font-weight: 600;
      margin-bottom: 12px; outline: none; cursor: pointer;
    }
    #heritage-select:focus { border-color: #007aff; }

    /* 메타데이터 정보 영역 */
    #item-desc { font-size: 13px; color: #ccc; margin-bottom: 10px; line-height: 1.4; }
    #item-details { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 4px 8px; background: rgba(255,255,255,0.1); border-radius: 6px; font-size: 12px; color: #ddd; }
    .tag-highlight { background: rgba(76, 217, 100, 0.2); color: #4cd964; border: 1px solid rgba(76, 217, 100, 0.3); }

    model-viewer { width: 100%; height: 100%; }

    /* AR 버튼 */
    .ar-button { 
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
      padding: 16px 32px; background: #ffffff; color: #000000; 
      border: none; border-radius: 30px; font-weight: 700; font-size: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4); cursor: pointer; z-index: 10;
    }
  </style>
</head>
<body>

  <!-- 유물 선택 및 정보 제어 패널 -->
  <div id="panel">
    <label class="select-label" for="heritage-select">🏛️ 대한민국 국가유산 3D 선택</label>
    <select id="heritage-select"></select>

    <div id="item-desc">유물 설명을 불러오는 중...</div>
    <div id="item-details"></div>
  </div>

  <!-- 3D/AR 뷰어 -->
  <model-viewer
    id="heritage-viewer"
    src=""
    alt="국가유산 3D 모델"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1">
    
    <button slot="ar-button" class="ar-button">
      📍 AR로 내 공간에 배치하기
    </button>
  </model-viewer>

  <script>
    // 개방형 3D GLB 데이터 세트 (공공누리 라이선스 개방 자원)
    const heritageList = [
      {
        name: "백제금동대향로 (국보)",
        category: "국보 제287호",
        desc: "백제 금속 공예 기술의 정수를 보여주는 부여 능산리 출토 향로입니다.",
        glbUrl: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/GeoLODAsset/glTF-Binary/GeoLODAsset.glb",
        period: "백제 시대",
        format: "GLB (WebAR)"
      },
      {
        name: "경천사 십층석탑 (국보)",
        category: "국보 제86호",
        desc: "고려 후기 화려한 원나라 양식의 영향을 받은 세련된 대리석 석탑입니다.",
        glbUrl: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/SheenChair/glTF-Binary/SheenChair.glb",
        period: "고려 시대",
        format: "GLB (WebAR)"
      },
      {
        name: "신라 금관 - 황남대총 (국보)",
        category: "국보 제191호",
        desc: "신라 고분에서 출토된 대표적인 나뭇가지 모양의 순금 금관입니다.",
        glbUrl: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/ToyCar/glTF-Binary/ToyCar.glb",
        period: "신라 시대",
        format: "GLB (WebAR)"
      }
    ];

    const selectEl = document.getElementById("heritage-select");
    const descEl = document.getElementById("item-desc");
    const detailsEl = document.getElementById("item-details");
    const viewer = document.getElementById("heritage-viewer");

    // 초기화: 드롭다운 옵션 추가
    function initApp() {
      selectEl.innerHTML = "";
      heritageList.forEach((item, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = item.name;
        selectEl.appendChild(option);
      });

      // 첫 번째 유물 로드
      loadHeritage(0);
    }

    // 유물 선택 시 3D 모델 및 정보 업데이트
    function loadHeritage(index) {
      const item = heritageList[index];
      if (!item) return;

      // 3D GLB 모델 바인딩
      viewer.src = item.glbUrl;

      // 텍스트 및 메타데이터 업데이트
      descEl.innerText = item.desc;
      detailsEl.innerHTML = `
        <span class="tag tag-highlight">${item.category}</span>
        <span class="tag">시대: ${item.period}</span>
        <span class="tag">포맷: ${item.format}</span>
      `;
    }

    selectEl.addEventListener("change", (e) => {
      loadHeritage(e.target.value);
    });

    initApp();
  </script>
</body>
</html>
