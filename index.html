<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Heritage AR - Real 3D Data</title>
  <!-- Google model-viewer CDN -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #111; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    
    #header {
      position: absolute; top: 20px; left: 20px; right: 20px; z-index: 10;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(12px);
      padding: 16px 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.12);
    }
    #item-title { font-size: 18px; font-weight: 700; margin: 0 0 6px 0; color: #ffffff; }
    #item-status { font-size: 13px; color: #4cd964; margin: 0; line-height: 1.4; }
    
    model-viewer { width: 100%; height: 100%; }
    
    .ar-button { 
      position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); 
      padding: 16px 32px; background: #ffffff; color: #000000; 
      border: none; border-radius: 30px; font-weight: 700; font-size: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4); cursor: pointer; z-index: 10;
    }
  </style>
</head>
<body>

  <div id="header">
    <h1 id="item-title">Loading Heritage 3D Resource...</h1>
    <p id="item-status">Connecting to ODCloud K-Heritage API...</p>
  </div>

  <!-- 3D 뷰어 -->
  <model-viewer
    id="heritage-viewer"
    src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/AntiqueCamera/glTF-Binary/AntiqueCamera.glb"
    alt="Korean National Heritage 3D Asset"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1">
    
    <button slot="ar-button" class="ar-button">📍 View in AR</button>
  </model-viewer>

  <script>
    const titleEl = document.getElementById("item-title");
    const statusEl = document.getElementById("item-status");

    async function loadODCloudHeritageData() {
      try {
        const response = await fetch('/api/heritage');
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

        const result = await response.json();
        console.log("ODCloud API Result:", result);

        if (result.data && result.data.length > 0) {
          // 첫 번째 3D 유물 원형 데이터 추출
          const firstItem = result.data[0];
          
          const heritageName = firstItem["문화재명_한글"] || "국가유산 3D 유물";
          const fileType = firstItem["파일 유형"] || "3D";
          const dataType = firstItem["데이터 취득 방식"] || "";
          const polygonCount = firstItem["폴리곤수"] ? firstItem["폴리곤수"].toLocaleString() : "N/A";

          titleEl.innerText = heritageName;
          statusEl.innerHTML = `✅ <b>3D 원형 DB 연동 완료</b><br>취득방식: ${dataType} | 파일: ${fileType} | 폴리곤: ${polygonCount}`;
        } else {
          statusEl.innerText = "⚠️ API 연동 성공했으나 데이터 항목이 없습니다.";
        }

      } catch (error) {
        console.error("API Fetch Error:", error);
        statusEl.innerText = `❌ Error: ${error.message}`;
      }
    }

    loadODCloudHeritageData();
  </script>
</body>
</html>
