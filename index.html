<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ar-k-heritage API Test</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 20px; background-color: #111; color: #fff; font-family: sans-serif; }
    #info { margin-bottom: 15px; padding: 12px; background: #222; border-radius: 8px; font-size: 13px; word-break: break-all; max-height: 150px; overflow-y: auto; }
    model-viewer { width: 100%; height: 60vh; background-color: #222; border-radius: 12px; }
    .ar-button { 
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); 
      padding: 14px 28px; background: #ffffff; color: #000000; 
      border: none; border-radius: 30px; font-weight: bold; font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>🏛️ K-Heritage API Connection</h2>
  <div id="info">Vercel 우회 서버를 통해 API 데이터 호출 중...</div>

  <model-viewer
    id="heritage-viewer"
    src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/AntiqueCamera/glTF-Binary/AntiqueCamera.glb"
    alt="K-Heritage Item"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate>
    <button slot="ar-button" class="ar-button">📍 View in AR</button>
  </model-viewer>

  <script>
    const infoDiv = document.getElementById("info");

    async function fetchHeritageData() {
      try {
        // 우리가 만든 Vercel 서버리스 함수(/api/heritage) 호출
        const response = await fetch('/api/heritage');
        
        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }

        const rawText = await response.text();
        console.log("Fetched API Data:", rawText);
        
        // 데이터가 수신되었음을 상단 상자에 표시
        infoDiv.innerHTML = `✅ <b>API 데이터 성공적으로 수신 완료!</b><br><br><pre style="white-space: pre-wrap; font-size: 11px; color: #00ffcc;">${rawText.substring(0, 300)}...</pre>`;

      } catch (error) {
        console.error("Fetch error:", error);
        infoDiv.innerHTML = `❌ <b>오류 발생:</b> ${error.message}`;
      }
    }

    fetchHeritageData();
  </script>
</body>
</html>
