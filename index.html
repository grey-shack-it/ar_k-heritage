<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Heritage 3D/AR Viewer</title>
  <!-- Google model-viewer CDN -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; padding: 0; width: 100vw; height: 100vh; 
      overflow: hidden; background-color: #111111; color: #ffffff; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    }
    
    /* 상단 유물 정보 패널 */
    #panel {
      position: absolute; top: 20px; left: 20px; right: 20px; z-index: 10;
      background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(12px);
      padding: 16px 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #title { font-size: 18px; font-weight: 700; margin: 0 0 4px 0; color: #ffffff; }
    #subtitle { font-size: 13px; color: #4cd964; margin: 0; }

    /* 3D 뷰어 영역 */
    model-viewer { width: 100%; height: 100%; }

    /* AR 카메라 실행 버튼 */
    .ar-button { 
      position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); 
      padding: 16px 32px; background: #ffffff; color: #000000; 
      border: none; border-radius: 30px; font-weight: 700; font-size: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4); cursor: pointer; z-index: 10;
    }
  </style>
</head>
<body>

  <!-- 유물 정보 패널 -->
  <div id="panel">
    <h1 id="title">국가유산 3D 데이터</h1>
    <p id="subtitle">✅ 로컬 3D 자원(.glb) 로드 완료</p>
  </div>

  <!-- 3D/AR 뷰어 (내 프로젝트의 models/heritage.glb 파일 직접 연결) -->
  <model-viewer
    id="heritage-viewer"
    src="./models/heritage.glb"
    alt="국가유산 3D 자원"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1">
    
    <button slot="ar-button" class="ar-button">
      📍 AR로 내 공간에 배치하기
    </button>
  </model-viewer>

</body>
</html>
